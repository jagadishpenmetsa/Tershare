name: Release native agent

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native executable
        working-directory: apps/agent
        run: cargo build --release

      - name: Package binary
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item apps/agent/target/release/tershare.exe dist/tershare.exe
          $hash = (Get-FileHash dist/tershare.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Set-Content dist/tershare.exe.sha256 -NoNewline
          @"
          {
            "version": "$version",
            "assets": {
              "x86_64-pc-windows-msvc": {
                "url": "https://github.com/${{ github.repository }}/releases/download/v$version/tershare.exe",
                "sha256": "$hash"
              }
            }
          }
          "@ | Set-Content dist/manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tershare-windows-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tershare.exe
            dist/tershare.exe.sha256
            dist/manifest.json
          generate_release_notes: true
