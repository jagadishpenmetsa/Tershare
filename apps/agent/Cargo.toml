[package]
name = "tershare-agent"
version = "0.1.6"
edition = "2021"
description = "TerShare native Windows agent — ConPTY + WebSocket relay client"
rust-version = "1.75"

[[bin]]
name = "tershare"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
